    <!-- tracked-out eyebrow -->
    <text x="48" y="64" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="11" letter-spacing="6" fill="#8DA9C4">SINGAPORE · 1.35°N 103.82°E</text>

    <!-- HCL self-portrait -->
    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="16">
      <text x="48" y="110" fill="#C97B63">resource <tspan fill="#EEF2F6">"human"</tspan> <tspan fill="#EEF2F6">"jaz"</tspan> <tspan fill="#8DA9C4">{</tspan></text>
      <text x="76" y="138" fill="#8DA9C4">role      <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"solutions architecture specialist"</tspan></text>
