    </g>

    <!-- dot grid, beside plan line -->
    <g fill="#8DA9C4" opacity="0.22">
      <circle cx="440" cy="278" r="1.4"/><circle cx="462" cy="278" r="1.4"/><circle cx="484" cy="278" r="1.4"/><circle cx="506" cy="278" r="1.4"/><circle cx="528" cy="278" r="1.4"/>
