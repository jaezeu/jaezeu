      <text x="76" y="216" fill="#8DA9C4">builds    <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"yet another POC (this one's different)"</tspan></text>
      <text x="76" y="242" fill="#8DA9C4">off_the_clock <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">["streetwear", "combat sports", "perfumes"]</tspan></text>
      <text x="48" y="270" fill="#8DA9C4">}</text>
