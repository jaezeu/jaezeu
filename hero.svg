<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="win"><rect width="900" height="420" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <!-- window ground -->
    <rect width="900" height="420" fill="#0F1E30"/>

    <!-- title bar -->
    <rect width="900" height="40" fill="#142A44"/>
    <line x1="0" y1="40.5" x2="900" y2="40.5" stroke="#22405E" stroke-width="1"/>
    <!-- traffic lights, kept in-palette -->
    <circle cx="26" cy="20" r="5.5" fill="#C97B63"/>
    <circle cx="48" cy="20" r="5.5" fill="#8DA9C4"/>
    <circle cx="70" cy="20" r="5.5" fill="#577590"/>
    <text x="450" y="24" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="11" letter-spacing="2" fill="#577590">jaz@singapore — ~/human · zsh</text>

    <!-- faint dot grid, bottom right -->
    <g fill="#8DA9C4" opacity="0.16">
      <circle cx="700" cy="356" r="1.4"/><circle cx="722" cy="356" r="1.4"/><circle cx="744" cy="356" r="1.4"/><circle cx="766" cy="356" r="1.4"/><circle cx="788" cy="356" r="1.4"/>
      <circle cx="700" cy="374" r="1.4"/><circle cx="722" cy="374" r="1.4"/><circle cx="744" cy="374" r="1.4"/><circle cx="766" cy="374" r="1.4"/>
      <circle cx="700" cy="392" r="1.4"/><circle cx="722" cy="392" r="1.4"/><circle cx="744" cy="392" r="1.4"/>
    </g>

    <!-- command -->
    <text x="40" y="78" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="15"><tspan fill="#C97B63">$</tspan> <tspan fill="#EEF2F6">terraform plan</tspan></text>
    <text x="40" y="102" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="12" fill="#577590" opacity="0.85">Refreshing state... reading resource "human" "jaz"... done.</text>

    <!-- HCL output -->
    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="16">
      <text x="40" y="140" fill="#C97B63">resource <tspan fill="#EEF2F6">"human"</tspan> <tspan fill="#EEF2F6">"jaz"</tspan> <tspan fill="#8DA9C4">{</tspan></text>
      <text x="68" y="168" fill="#8DA9C4">role      <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"solutions architecture specialist"</tspan></text>
      <text x="68" y="194" fill="#8DA9C4">automates <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"anything worth doing twice"</tspan></text>
      <text x="68" y="220" fill="#8DA9C4">educates  <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"cloud engineering, from design to day-2 ops"</tspan></text>
      <text x="68" y="246" fill="#8DA9C4">builds    <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">"yet another POC (this one's different)"</tspan></text>
      <text x="68" y="272" fill="#8DA9C4">off_the_clock <tspan fill="#577590">=</tspan> <tspan fill="#EEF2F6">["streetwear", "combat sports", "perfumes"]</tspan></text>
      <text x="40" y="300" fill="#8DA9C4">}</text>
    </g>

    <!-- plan summary -->
    <text x="40" y="336" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="13" fill="#577590">Plan: <tspan fill="#C97B63">1 to add</tspan>, 0 to change, 0 to destroy.</text>

    <!-- idle prompt with blinking cursor -->
    <text x="40" y="376" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="15" fill="#C97B63">$</text>
    <rect x="58" y="362" width="9" height="17" fill="#8DA9C4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- window edge -->
  <rect x="0.5" y="0.5" width="899" height="419" rx="11.5" stroke="#22405E"/>
</svg>
